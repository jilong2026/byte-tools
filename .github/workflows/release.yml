# -*- coding: utf-8 -*-
# 跨平台发布工作流：监听 git tag（v*.*.*）推送，在 macOS / Linux / Windows
# runner 上分别执行 PyInstaller 打包，并把产物上传到对应 GitHub Release。
#
# 触发方式（本地操作示例）：
#     git tag v1.0.0
#     git push origin v1.0.0
#
# 产物清单（与项目 README 文档一致，3 个平台共 4 个文件）：
#     byte-tools.exe                  Windows x64 单可执行文件（双击运行）
#     byte-tools-windows-x64.zip      Windows x64 产物压缩包（分发备份）
#     byte-tools-macos-arm64.zip      macOS Apple Silicon 原生包
#     byte-tools-linux-x64            Linux x64 单可执行文件
#
# 变更记录（2026-09）：Intel 通用包 byte-tools-macos.zip 已停用，原因见 matrix 中的说明
# 变更记录（2026-09）：Release 改为全自动发布 —— 矩阵各平台先传草稿暂存区，
#                    sync-to-gitee 任务核对齐全后自动取消草稿，无需人工点 Publish
# 变更记录（2026-09）：Gitee 同步逻辑抽到 同步Gitee产物.sh —— 加入网络重试
#                    （境外 runner 连 gitee.com 会偶发 curl 35）、幂等复用
#                    （Re-run 不产生重复 Release/附件）、上传后附件清单校验
# 变更记录（2026-09-29）：Gitee 侧不再跨海推大二进制 —— 默认 UPLOAD_ARTIFACTS 为空，
#                    脚本只在 Gitee Release 正文写 GitHub 直链；同时给 sync-to-gitee
#                    加 timeout-minutes，并把脚本的静默长超时改成「每次请求都打耗时/字节/
#                    状态码 + 4xx 立即判死」（v1.0.3 曾因此静默挂死 70 分钟以上）

name: release

on:
  push:
    # 仅 v 开头的版本号 tag 触发，避免任意分支推送误触发
    tags:
      - 'v*'
  # 手动触发：用于补同步历史 tag —— 例如 Gitee 侧网络失败导致产物缺失，
  # 而 GitHub Release 已经是好的。填写 tag_name 后只跑 Gitee 同步任务，
  # 不重新构建，直接复用 GitHub Release 上已有的产物。
  # 入口：GitHub 仓库 → Actions → release → Run workflow
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要同步到 Gitee 的 tag，例如 v1.0.2'
        required: true
        type: string

# Release 资产上传需要 contents: write 权限
permissions:
  contents: write

# 顶层常量集中管理，避免散落在各 step 中的硬编码与魔法字符串
env:
  # Python 版本：PySide6 6.6+ 要求 3.9+，3.12 LTS 稳定且 PyInstaller 6.x 完美支持
  PYTHON_VERSION: '3.12'
  # PyInstaller 最低版本：spec 中使用了 5.0+ 引入的 hooksconfig 参数
  PYINSTALLER_MIN_VERSION: '6.0'
  # 国内 pip 镜像（清华源），加速 PySide6 等大体积 wheel 下载
  # GitHub runner 在境外，但走清华源仍可加速国内 CN 区域的拉取
  PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  # Gitee 仓库 owner（用户名或组织名），按你的 Gitee 实际账号修改
  # Gitee 与 GitHub 账号名通常不同，此处必须改成 Gitee 上的真实 owner
  GITEE_OWNER: jack_liujilong
  # Gitee 仓库名，与 GitHub 仓库名一致时无需改动
  GITEE_REPO: byte-tools

jobs:
  build:
    name: 构建 ${{ matrix.platform_name }}
    # 手动补同步时不重新构建：产物已经在 GitHub Release 上了，重新打包纯属浪费
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    # 兜底：单个平台 job 的最长运行时长，超时会被取消（默认 360 分钟太长，
    # 一卡就是 6 小时，且会让 needs: build 的 Gitee 同步 job 一直等）。
    # 正常构建各平台只需 2~3 分钟。注意：GitHub 文档对「排队中是否计时」表述不明确，
    # 此配置主要防的是 job 已经开始跑之后卡死；若 runner 标签被下线而卡在 queued，
    # 至少能在 job 超时后以失败告终，而不是无限等待。
    timeout-minutes: 45
    strategy:
      # 任何一个平台失败不影响其他平台继续构建
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon 原生构建（macos-15 = 当前可用的 arm64 标准 runner；
          # macos-14 已被 GitHub 标记 deprecated，随时可能下线）
          - platform_name: macOS (Apple Silicon)
            runner: macos-15
            artifact_name: byte-tools-macos-arm64.zip
            artifact_extra: ''
            artifact_kind: macos
          # 【已停用 2026-09】macOS 通用版（Intel 构建）：
          #   GitHub 已下线 macos-13(Intel) runner，该 job 不会报错，而是永久停在 queued，
          #   并连带 needs: build 的「同步产物到 Gitee Release」永不执行
          #   —— v1.0.3 / v1.0.4 两次 Gitee 同步失败的根因。
          #   如需恢复 Intel 包：把 runner 改为 macos-15-intel 并取消以下注释后试跑；
          #   若账号/仓库不支持该标签会同样卡排队，那就只能自建 runner 或放弃 Intel 包。
          # - platform_name: macOS (通用)
          #   runner: macos-13
          #   artifact_name: byte-tools-macos.zip
          #   artifact_extra: ''
          #   artifact_kind: macos
          # Linux x64 单可执行文件
          - platform_name: Linux (x64)
            runner: ubuntu-latest
            artifact_name: byte-tools-linux-x64
            artifact_extra: ''
            artifact_kind: linux
          # Windows x64：主产物 byte-tools.exe（双击运行），额外打包 byte-tools-windows-x64.zip 作为分发备份
          - platform_name: Windows (x64)
            runner: windows-latest
            artifact_name: byte-tools.exe
            artifact_extra: byte-tools-windows-x64.zip
            artifact_kind: windows

    steps:
      # 1. 检出仓库代码（默认浅克隆 fetch-depth=1 即可满足打包需求）
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 安装指定版本的 Python 解释器
      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # 3. Linux runner 需要预先安装 PySide6 运行时依赖的图形/字体库
      #    否则即使打包成功，运行时也会因为缺失 libEGL / libxkbcommon 等库而崩溃
      - name: 安装 Linux 系统依赖（仅 Linux）
        if: matrix.artifact_kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0

      # 4. 升级 pip 并通过环境变量配置国内镜像源
      #    使用 bash shell 保证跨平台行为一致（Windows runner 默认 shell 也切到 bash）
      - name: 升级 pip 并配置国内镜像源
        run: |
          python -m pip install --upgrade pip
          echo "已切换 pip 镜像到: ${{ env.PIP_INDEX_URL }}"
        shell: bash

      # 5. 安装项目运行时依赖与 PyInstaller
      - name: 安装依赖（PySide6 / requests / PyInstaller）
        run: |
          pip install -r requirements.txt
          pip install "pyinstaller>=${{ env.PYINSTALLER_MIN_VERSION }}"
        shell: bash

      # 6. 执行 PyInstaller 打包（spec 文件已声明跨平台逻辑，无需额外参数）
      - name: 执行 PyInstaller 打包
        run: pyinstaller --noconfirm byte-tools.spec
        shell: bash

      # 7. macOS 产物：ditto 保留 .app bundle 结构与权限，打成 zip
      #    加 set -e 让 ditto 失败时 step 立即 fail，避免静默通过
      - name: 打包 macOS 产物（.app -> .zip）
        if: matrix.artifact_kind == 'macos'
        run: |
          set -e
          cd dist
          # ditto 是 macOS 原生命令，能正确保留 .app 内部可执行权限与符号链接
          ditto -c -k --keepParent byte-tools.app "../${{ matrix.artifact_name }}"
          cd ..
          # 校验产物文件确实生成，避免后续 softprops 静默跳过上传
          [ -f "${{ matrix.artifact_name }}" ] || { echo "错误：产物 ${{ matrix.artifact_name }} 未生成"; exit 1; }
          echo "产物大小: $(du -sh ${{ matrix.artifact_name }} | cut -f1)"
        shell: bash

      # 8. Linux 产物：单可执行文件直接重命名为最终名称，保留可执行权限
      #    加 set -e 让 mv/chmod 失败时 step 立即 fail
      - name: 重命名 Linux 产物
        if: matrix.artifact_kind == 'linux'
        run: |
          set -e
          mv dist/byte-tools "${{ matrix.artifact_name }}"
          chmod +x "${{ matrix.artifact_name }}"
          [ -f "${{ matrix.artifact_name }}" ] || { echo "错误：产物 ${{ matrix.artifact_name }} 未生成"; exit 1; }
          echo "产物大小: $(du -sh ${{ matrix.artifact_name }} | cut -f1)"
        shell: bash

      # 9. Windows 产物：重命名 dist/byte-tools.exe 为最终名 byte-tools.exe，
      #    再用 Compress-Archive 打一份 byte-tools-windows-x64.zip 作为分发备份
      #    $ErrorActionPreference='Stop' 让 PowerShell 命令出错时立即抛异常而非静默继续
      - name: 准备 Windows 产物（.exe + .zip）
        if: matrix.artifact_kind == 'windows'
        run: |
          $ErrorActionPreference = 'Stop'
          Move-Item -Path dist/byte-tools.exe -Destination ${{ matrix.artifact_name }} -Force
          Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath ${{ matrix.artifact_extra }}
          if (-not (Test-Path ${{ matrix.artifact_name }})) { throw "产物未生成: ${{ matrix.artifact_name }}" }
          if (-not (Test-Path ${{ matrix.artifact_extra }})) { throw "产物未生成: ${{ matrix.artifact_extra }}" }
          Write-Host "exe 大小: $((Get-Item ${{ matrix.artifact_name }}).Length) bytes"
          Write-Host "zip 大小: $((Get-Item ${{ matrix.artifact_extra }}).Length) bytes"
        shell: pwsh

      # 10. 构造上传文件列表（Windows 平台同时上传 exe 和 zip，其他平台只上传主产物）
      #     通过 GITHUB_OUTPUT 多行变量传递给 softprops，避免空行导致 fail_on_unmatched_files 报错
      - name: 构造上传文件列表
        id: files_list
        run: |
          if [ -n "${{ matrix.artifact_extra }}" ]; then
            {
              echo "files<<EOF"
              echo "${{ matrix.artifact_name }}"
              echo "${{ matrix.artifact_extra }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "files=${{ matrix.artifact_name }}" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      # 11. 上传构建产物到当前 tag 对应的 GitHub Release
      #     softprops/action-gh-release 是社区主流的 release 上传 action，稳定且 API 友好
      - name: 上传产物到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 通过 step 输出动态拿到要上传的文件列表
          files: ${{ steps.files_list.outputs.files }}
          # 严格模式：files 没匹配到任何文件时让 job 直接失败，而不是静默跳过
          # 这是修复 v1.0.3 静默失败坑的关键开关
          fail_on_unmatched_files: true
          # 生成 Release Notes：自动汇总从上一个 tag 到当前 tag 的提交记录
          generate_release_notes: true
          # 草稿模式：矩阵各平台先上传到同一个草稿 Release 作为暂存区，
          # 中途失败不会对外暴露半成品；等全部平台成功、Gitee 同步启动后，
          # 由 sync-to-gitee 任务的「发布 GitHub Release」step 自动取消草稿完成发布。
          # 即：全流程无人工步骤，draft 只是内部暂存状态，最终会变回正式 Release。
          draft: true

  # 同步任务：等 3 个平台产物全部上传到 GitHub Release 后，
  # 创建 Gitee Release 并在正文里写清各平台产物的 GitHub 直链。
  # 默认不再把大二进制跨境推到 Gitee（2026-09-29 起，详见 同步Gitee产物.sh 顶部说明）；
  # 需要站内直下时改 UPLOAD_ARTIFACTS 并把 runs-on 换成国内 self-hosted runner。
  # 依赖 GITEE_TOKEN Secret（在 Gitee 个人设置 → 私人令牌 生成后填到 GitHub Secrets）
  sync-to-gitee:
    name: 同步产物到 Gitee Release
    needs: build  # 必须等所有平台构建完成，否则下载不到产物
    # tag 推送：三平台构建成功后才跑；手动补同步：build 被跳过也要跑，
    # 所以这里用 always() 兜住，再用 needs.build.result 过滤构建失败的情况
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success') }}
    # 【2026-09-29 卡死教训】这段 job 之前没有 timeout-minutes，走 GitHub 默认 360 分钟：
    # 一个 84MB 的境外上传就能把它挂满 6 小时（v1.0.3 实测挂 70 分钟零落地、零日志）。
    # 现在策略改成「Gitee 只写正文直链、不跨海推大二进制」，正常用量是秒级；
    # 25 分钟 = 4 个接口调用 × 3 次重试 × API 上限 60s 的余量，足够宽，又能保证卡死会红。
    timeout-minutes: 25
    # 默认用 GitHub 境外 runner。已知风险：境外连 gitee.com:443 会偶发
    # curl(35) SSL_ERROR_SYSCALL（TLS 握手被重置），脚本已做指数退避重试。
    # 若要把产物真正传进 Gitee（改 UPLOAD_ARTIFACTS），建议把这一行换成 runs-on: self-hosted，
    # runner 部署在能直连 gitee.com 的国内机器上（需预装 gh CLI 与 curl），脚本本身无需改动
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码（只为了拿到 同步Gitee产物.sh，不参与构建）
      #    【2026-09-30 硬教训】这里必须固定 master，不能用 tag 的 commit。
      #    默认 checkout 会取「触发本次 workflow 的那个 ref」——tag 推送时就是
      #    tag 指向的 commit，于是脚本版本被旧 tag 钉死：v1.0.5、v1.0.6 两次都是
      #    Gitee 同步脚本刚在 master 修好，但 tag 指向的 commit 上还是旧版，
      #    重推 tag / Re-run job 都复用同一个旧 commit，永远修不好（且报错一模一样）。
      #    同步脚本是运维工具而非产品代码，跟着 master 走才对：
      #    任何历史 tag 补跑（workflow_dispatch）都能立刻吃到最新修复。
      #    构建产物仍来自被推送的 tag（下面用 gh release download 按 TAG_NAME 取）。
      - name: 检出代码（固定 master，取最新同步脚本）
        uses: actions/checkout@v4
        with:
          ref: master

      # 2. 用 gh CLI 下载 GitHub Release 当前 tag 下的所有产物
      #    gh 已预装在 GitHub runner，GITHUB_TOKEN 自动有 release 读取权限
      #    注意：draft release 的产物 gh 也能下载，所以不必先 publish
      - name: 下载 GitHub Release 所有产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 手动补同步时用输入的 tag_name，tag 推送时用被推送的 tag
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
        run: |
          set -e
          mkdir -p ./assets
          echo "正在从 GitHub Release ${TAG_NAME} 下载产物..."
          gh release download "${TAG_NAME}" --dir ./assets --clobber
          echo "下载完成，产物列表："
          ls -lh ./assets/

      # 3. 自动发布 GitHub Release（取消草稿）
      #    能走到这里说明 3 个平台全部构建成功（sync 任务 needs: build），
      #    因此自动取消草稿 = 全自动发布；构建失败时本任务根本不启动，草稿不会外泄。
      #    放在 Gitee 步骤之前：若 Gitee 侧失败，Gitee 上不会留下半成品 release，
      #    重跑本任务可从干净状态重来。
      - name: 发布 GitHub Release（取消草稿）
        # 补同步场景：Release 早就发布了，这一步无意义；且历史 tag 可能已无草稿可改，跳过
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 手动补同步时用输入的 tag_name，tag 推送时用被推送的 tag
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
        run: |
          set -e
          gh release edit "${TAG_NAME}" --draft=false
          # 复核一次：确认确实已发布，避免命令静默无效（草稿不会进 releases/latest）
          IS_DRAFT=$(gh release view "${TAG_NAME}" --json isDraft --jq '.isDraft')
          if [ "${IS_DRAFT}" != "false" ]; then
            echo "错误：GitHub Release ${TAG_NAME} 仍是草稿，取消草稿未生效"
            exit 1
          fi
          echo "GitHub Release ${TAG_NAME} 已发布"


      # 4. 同步产物信息到 Gitee Release（实际逻辑在 同步Gitee产物.sh）
      #    【2026-09-29 策略变更】默认 UPLOAD_ARTIFACTS 为空：Gitee 侧不再挂大二进制产物，
      #    脚本只在 Gitee Release 正文里写好各平台产物的 GitHub 直链。原因：境外 runner
      #    往 gitee.com 推 84MB 会长时间挂死且服务端根本不落地（v1.0.3 实测挂 70 分钟、
      #    旧脚本 -sS + curl 内部 --retry + --max-time 1800 ×4 轮 → 单文件最坏静默 6 小时）。
      #    为什么抽成脚本而不是在这里裸写 curl：
      #    - 境外 runner 连 gitee.com:443 会偶发 curl(35) SSL_ERROR_SYSCALL
      #      （TLS 握手被重置）。脚本对每次请求做指数退避重试，单次抖动不再判死 job。
      #    - 脚本幂等：Release 已存在就复用 ID，附件已存在就跳过上传，
      #      所以失败后直接 Re-run 本 job 是安全的，不会产生重复 Release 或重复附件。
      #    - 收尾强校验：正文直链必须回读到位；UPLOAD_ARTIFACTS 指定的附件必须全部出现，
      #      缺一个就失败，不会静默「同步成功」。
      - name: 同步产物到 Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ env.GITEE_OWNER }}
          GITEE_REPO: ${{ env.GITEE_REPO }}
          # 手动补同步时用输入的 tag_name，tag 推送时用被推送的 tag
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
          ASSETS_DIR: ./assets
          TARGET_COMMITISH: master
          # 生成正文里的 GitHub 产物直链（Gitee 用户据此下载）
          GITHUB_REPO_SLUG: ${{ github.repository }}
          # 产物清单：正文表格、上传资格、收尾校验都以这一处为准。
          # 与上面 build job 的 matrix 产物名同步维护 —— 这是唯一维护点
          RELEASE_ARTIFACTS: 'byte-tools.exe|byte-tools-windows-x64.zip|byte-tools-macos-arm64.zip|byte-tools-linux-x64'
          # 要真正上传到 Gitee 的子集；留空 = 一个都不传（2026-09-29 起的默认策略）。
          # 确有「Gitee 站内直下」需求时，只把小包填进来（例如 windows zip），
          # 并把本 job 的 runs-on 换成国内 self-hosted runner，否则又是跨境硬推
          UPLOAD_ARTIFACTS: ''
          # 单次请求最多尝试 3 次（退避 5s / 10s）；curl 自身不再叠 --retry
          MAX_ATTEMPTS: '3'
          API_MAX_TIME: '60'          # JSON 接口单请求上限（秒）
          UPLOAD_MAX_TIME: '300'      # 附件上传单请求上限（秒）
        run: |
          set -e
          chmod +x "./同步Gitee产物.sh"
          "./同步Gitee产物.sh"

      # 5. 收尾：把两边 Release 地址都打出来，方便一眼核对
      - name: 打印发布结果
        env:
          # 手动补同步时用输入的 tag_name，tag 推送时用被推送的 tag
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
        run: |
          echo "GitHub Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG_NAME}"
          echo "Gitee  Release: https://gitee.com/${{ env.GITEE_OWNER }}/${{ env.GITEE_REPO }}/releases/${TAG_NAME}"

      # 6. 失败兜底指引：本 job 在「GitHub Release 已发布」之后执行，
      #    所以走到这里说明 GitHub 侧产物是全的，只有 Gitee 侧需要补
      - name: Gitee 同步失败处理指引
        if: failure()
        run: |
          echo "::warning::Gitee 同步失败，但 GitHub Release 已发布成功，产物齐全。"
          echo "处理方式："
          echo "  1) 直接 Re-run 本 job —— 脚本幂等，可安全重试；"
          echo "  2) 若重试仍失败，说明当前 runner 到 gitee.com 的链路不通："
          echo "     a. 把本 job 的 runs-on 改为 self-hosted，runner 部署在能直连 gitee.com 的国内机器上；"
          echo "     b. 或在本机手动执行 同步Gitee产物.sh（需 GITEE_TOKEN 与已下载的产物目录）。"
